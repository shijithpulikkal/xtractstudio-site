name: Update blog posts

# Copies the latest Hashnode posts into js/posts.js so the
# website can show them without calling Hashnode from the browser.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-blog-posts
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch posts from Hashnode
        run: python scripts/update_posts.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- js/posts.js; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add js/posts.js
          git commit -m "Update blog posts from Hashnode"
          git push
